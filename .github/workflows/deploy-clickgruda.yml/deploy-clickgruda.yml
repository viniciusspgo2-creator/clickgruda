# Deploy automático do clickgruda na VPS Contabo.
#
# ATIVO desde 2026-11-10: a cada push na main, entra na VPS por SSH e
# roda o deploy.sh. O painel de status (http://IP-da-VPS:8080/) mostra
# o commit que está no ar, para conferir se o deploy deu certo.
#
# Fluxo que o Vinicius pediu (igual à Vercel): ele edita, sobe pelo
# GitHub Desktop (push na main) e o deploy acontece sozinho, sem entrar
# no servidor nem rodar comando.
#
# Pré-requisito: o commit com output: "standalone" no next.config.ts
# precisa já estar na main — sem ele o start falha na VPS (ver README).
#
# Secrets necessários no repo (Settings → Secrets → Actions):
#   VPS_HOST     — IP ou hostname da VPS
#   VPS_USER     — usuário SSH (ex.: root)
#   VPS_SSH_KEY  — chave privada SSH (nunca senha)
#   VPS_PORT     — porta SSH (22 por padrão)
#
# O deploy em si mora em vps/deploy.sh na VPS (/srv/clickgruda/deploy.sh).
# Se o build falhar, o script aborta ANTES do pm2 reload: o site antigo
# continua no ar. Rollback de um deploy ruim = git revert + novo push.

name: Deploy clickgruda na VPS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: /srv/clickgruda/deploy.sh
